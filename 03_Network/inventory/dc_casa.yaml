# =====================================================================================================
#  DC Casablanca – TIA-942 Rated-3 – GNS3 lab
#  SINGLE SOURCE OF TRUTH. Device configs (configs/), report tables (report/content/generated/) and
#  automation all read this file. Change the network here, then re-run automation/gen_configs.py.
#  Spec: 05_Report/Datacenter_Casablanca_TIA942_GNS3_detaille.pdf (Tables 15, 16, 17, 18, 25, 27)
# =====================================================================================================

site:
  name: DC-CASA
  domain: dc.casa.lab
  timezone: Africa/Casablanca          # UTC+1 (IOS: clock timezone WET 1)
  asn: 65100
  public_prefix: 192.0.2.0/24          # RFC 5737 documentation prefix announced to both ISPs
  snat_ip: 192.0.2.10                  # outbound NAT address (pfSense)
  web_public_ip: 192.0.2.80            # DNAT -> SRV-WEB-01

# Central services every device uses (ISO 27001 A.8.15 logging, A.8.17 clock sync)
services:
  dns: 10.100.0.11
  ntp: 10.100.0.11
  syslog: 10.60.0.12
  log_retention_days: 30           # collector: daily rotation, gzip, 30 files kept per source (dc/syslog 1.1, LOG.2)
  log_viewer: https://10.60.0.12/  # read-only viewer, login credentials.admin_user (A.8.15), port 443 = rule T18-6
  monitoring: 10.60.0.11
  snmp_trap: 10.60.0.11

# Lab-only credentials (documented in the report annex; never reuse outside the lab)
credentials:
  admin_user: netadmin
  admin_password: "Esprim-DC-2026!"
  server_user: ubuntu                  # image default account of the Ubuntu VMs: console only, refused by SSH (ADM.4)
  server_password: "ubuntu"
  server_admin_user: sysadmin          # administration account of the Ubuntu servers (SSH)
  server_admin_password: "Esprim-Srv-2026!"
  bastion_totp_secret: "2N6PYPMNY7M6AUOZ"   # second factor of SRV-BASTION (RFC 6238); code: python automation/totp.py
  enable_secret: "Esprim-Enable-2026!"
  snmpv3_user: zbxmon
  snmpv3_auth: "Zbx-Auth-2026!"        # SHA
  snmpv3_priv: "Zbx-Priv-2026!"        # AES-128
  snmp_ro_community: "dc-casa-ro"      # pfSense bsnmpd (v2c, restricted to VLAN 60)
  hsrp_key: "Hsrp-DC-2026"
  ospf_key: "Ospf-DC-2026"
  bgp_password: "Bgp-DC-2026"
  carp_password: "Carp-DC-2026"
  zabbix_db_password: "Zbx-Db-2026!"
  grafana_admin_password: "Grafana-DC-2026!"
  zabbix_admin_password: "Zbx-Supervision-2026!"   # replaces the default Admin / zabbix (zabbix_setup.py apply)
  zabbix_grafana_password: "Zbx-NocRead-2026!"     # read-only Zabbix account `grafana` used by the Grafana data source
  truenas_admin_password: "TrueNAS-DC-2026!"       # SRV-BCK-01 (TrueNAS SCALE) web UI account truenas_admin (PLAN_04)

# ---------------------------------------------------------------------------------------------------
# VLANs (PDF Table 15 + technical VLANs). gw_type: core = HSRP on CORE-A/B, fw = CARP on FW-A/B
# ---------------------------------------------------------------------------------------------------
vlans:
  10:  {name: MGMT,          subnet: 10.10.0.0/24,  gw_type: fw,   vip: 10.10.0.254, fw_a: 10.10.0.11,  fw_b: 10.10.0.12,  zone: MANAGEMENT,     purpose: "Management hors bande (OOB) des équipements"}
  20:  {name: SERVEURS,      subnet: 10.20.0.0/24,  gw_type: core, vip: 10.20.0.1,   active: CORE-A, zone: INTERNE,        purpose: "Serveurs de calcul / applicatifs"}
  30:  {name: STOCKAGE,      subnet: 10.30.0.0/24,  gw_type: core, vip: 10.30.0.1,   active: CORE-B, zone: INTERNE,        purpose: "Stockage (NFS, iSCSI)"}
  40:  {name: BACKUP,        subnet: 10.40.0.0/24,  gw_type: core, vip: 10.40.0.1,   active: CORE-A, zone: INTERNE,        purpose: "Sauvegarde"}
  50:  {name: DMZ,           subnet: 10.50.0.0/24,  gw_type: fw,   vip: 10.50.0.1,   fw_a: 10.50.0.2,   fw_b: 10.50.0.3,   zone: DMZ,            purpose: "Services exposés à Internet"}
  60:  {name: MONITORING,    subnet: 10.60.0.0/24,  gw_type: core, vip: 10.60.0.1,   active: CORE-A, zone: INTERNE,        purpose: "Supervision et journalisation"}
  70:  {name: BMS-DCIM,      subnet: 10.70.0.0/24,  gw_type: core, vip: 10.70.0.1,   active: CORE-B, zone: INTERNE,        purpose: "GTB / DCIM"}
  80:  {name: SECURITE-CCTV, subnet: 10.80.0.0/24,  gw_type: core, vip: 10.80.0.1,   active: CORE-B, zone: INTERNE,        purpose: "Vidéosurveillance, contrôle d'accès"}
  90:  {name: ADMIN,         subnet: 10.90.0.0/24,  gw_type: fw,   vip: 10.90.0.1,   fw_a: 10.90.0.2,   fw_b: 10.90.0.3,   zone: ADMINISTRATION, purpose: "Poste d'administration, bastion"}
  100: {name: SERVICES-INT,  subnet: 10.100.0.0/24, gw_type: core, vip: 10.100.0.1,  active: CORE-A, zone: INTERNE,        purpose: "DNS, NTP, DHCP, services internes"}
  901: {name: TRANSIT-EXT,   subnet: 10.254.1.0/28, gw_type: none, zone: TRANSIT, purpose: "Transit Edge – pare-feux (SW-OUT)"}
  902: {name: TRANSIT-INT,   subnet: 10.254.2.0/28, gw_type: none, zone: TRANSIT, purpose: "Transit pare-feux – cœur"}
  998: {name: OSPF-CORE,     subnet: 10.254.4.0/30, gw_type: none, zone: TRANSIT, purpose: "Adjacence OSPF entre cœurs"}
  999: {name: PARKING,       subnet: null,          gw_type: none, zone: NONE,    purpose: "Ports inutilisés (désactivés)"}

data_vlans: [20, 30, 40, 60, 70, 80, 100]     # routed by the Cores, trunked to the Leafs
core_vlans: [20, 30, 40, 60, 70, 80, 100, 902, 998]

transit:
  ext:  {subnet: 10.254.1.0/28, fw_vip: 10.254.1.1, EDGE-A: 10.254.1.2, EDGE-B: 10.254.1.3, FW-A: 10.254.1.4, FW-B: 10.254.1.5, edge_vip: 10.254.1.6}
  int:  {subnet: 10.254.2.0/28, fw_vip: 10.254.2.1, CORE-A: 10.254.2.2, CORE-B: 10.254.2.3, FW-A: 10.254.2.4, FW-B: 10.254.2.5, core_vip: 10.254.2.6}
  sync: {subnet: 10.254.3.0/30, FW-A: 10.254.3.1, FW-B: 10.254.3.2}
  ospf_core: {subnet: 10.254.4.0/30, CORE-A: 10.254.4.1, CORE-B: 10.254.4.2}
  edge_isl:  {subnet: 10.254.0.0/30, EDGE-A: 10.254.0.1, EDGE-B: 10.254.0.2}

# ---------------------------------------------------------------------------------------------------
# WAN (RFC 5737 / RFC 5398). Primary pairs follow PDF Table 16; cross links add a 2nd path per Edge.
# ---------------------------------------------------------------------------------------------------
isps:
  ISP-A: {asn: 64500, lp_in: 200, prepend_out: 0, nat_uplink: eth2, links: {eth0: {peer: EDGE-A, net: 198.51.100.0/30, ip: 198.51.100.1, peer_ip: 198.51.100.2}, eth1: {peer: EDGE-B, net: 198.51.100.4/30, ip: 198.51.100.5, peer_ip: 198.51.100.6}}}
  ISP-B: {asn: 64501, lp_in: 100, prepend_out: 2, nat_uplink: eth2, links: {eth0: {peer: EDGE-A, net: 203.0.113.4/30, ip: 203.0.113.5, peer_ip: 203.0.113.6}, eth1: {peer: EDGE-B, net: 203.0.113.0/30, ip: 203.0.113.1, peer_ip: 203.0.113.2}}}

# ---------------------------------------------------------------------------------------------------
# Network devices. tia = TIA-942 space; ports = adapter -> link (used for TIA-606 descriptions)
# ---------------------------------------------------------------------------------------------------
devices:
  EDGE-A:
    role: edge
    platform: iosv
    tia: ER          # Entrance Room / Main Meet-Me Room
    loopback: 10.255.0.1
    mgmt: {ip: 10.10.0.1, port: Gi0/5}
    hsrp_ext_priority: 110
    ports:
      Gi0/0: {to: "ISP-A:eth0", mode: routed, ip: 198.51.100.2/30, role: "WAN eBGP ISP-A (primaire)"}
      Gi0/1: {to: "ISP-B:eth0", mode: routed, ip: 203.0.113.6/30, role: "WAN eBGP ISP-B (secours)"}
      Gi0/2: {to: "EDGE-B:Gi0/2", mode: routed, ip: 10.254.0.1/30, role: "ISL iBGP/OSPF"}
      Gi0/3: {to: "SW-OUT:Ethernet0", mode: routed, ip: 10.254.1.2/28, role: "Transit externe VLAN 901"}
      Gi0/5: {to: "SW-MGMT:Ethernet0", mode: mgmt, role: "OOB VLAN 10"}
  EDGE-B:
    role: edge
    platform: iosv
    tia: ER
    loopback: 10.255.0.2
    mgmt: {ip: 10.10.0.2, port: Gi0/5}
    hsrp_ext_priority: 100
    ports:
      Gi0/0: {to: "ISP-A:eth1", mode: routed, ip: 198.51.100.6/30, role: "WAN eBGP ISP-A (primaire)"}
      Gi0/1: {to: "ISP-B:eth1", mode: routed, ip: 203.0.113.2/30, role: "WAN eBGP ISP-B (secours)"}
      Gi0/2: {to: "EDGE-A:Gi0/2", mode: routed, ip: 10.254.0.2/30, role: "ISL iBGP/OSPF"}
      Gi0/3: {to: "SW-OUT:Ethernet1", mode: routed, ip: 10.254.1.3/28, role: "Transit externe VLAN 901"}
      Gi0/5: {to: "SW-MGMT:Ethernet1", mode: mgmt, role: "OOB VLAN 10"}

  FW-A:
    role: firewall
    platform: pfsense
    tia: MDA
    loopback: 10.255.0.11
    mgmt: {ip: 10.10.0.11, port: em6.10}
    carp_advskew: 0
    ports:
      em0: {to: "SW-OUT:Ethernet2", role: "WAN – transit externe VLAN 901"}
      em2: {to: "FW-B:em2", role: "SYNC – pfsync / XMLRPC"}
      em3: {to: "SW-IN:Ethernet0", role: "LAN – lagg0 membre primaire (VLAN 902, SW-IN)"}
      em4: {to: "SW-IN:Ethernet1", role: "LAN – lagg0 membre secours (VLAN 902, SW-IN)"}
      em5: {to: "SW-DMZ:Ethernet0", role: "DMZ VLAN 50"}
      em6: {to: "SW-MGMT:Ethernet2", role: "Trunk 802.1Q VLAN 10 (MGMT) + 90 (ADMIN)"}
  FW-B:
    role: firewall
    platform: pfsense
    tia: MDA
    loopback: 10.255.0.12
    mgmt: {ip: 10.10.0.12, port: em6.10}
    carp_advskew: 100
    ports:
      em0: {to: "SW-OUT:Ethernet3", role: "WAN – transit externe VLAN 901"}
      em2: {to: "FW-A:em2", role: "SYNC – pfsync / XMLRPC"}
      em3: {to: "SW-IN:Ethernet2", role: "LAN – lagg0 membre primaire (VLAN 902, SW-IN)"}
      em4: {to: "SW-IN:Ethernet3", role: "LAN – lagg0 membre secours (VLAN 902, SW-IN)"}
      em5: {to: "SW-DMZ:Ethernet1", role: "DMZ VLAN 50"}
      em6: {to: "SW-MGMT:Ethernet3", role: "Trunk 802.1Q VLAN 10 (MGMT) + 90 (ADMIN)"}

  CORE-A:
    role: core
    platform: iosvl2
    tia: MDA
    loopback: 10.255.0.21
    mgmt: {ip: 10.10.0.21, port: Gi2/0}
    svi_host: 2            # SVI address = .2 in every core VLAN
    hsrp_active_priority: 110
    hsrp_standby_priority: 90
    ports:
      Gi0/0: {to: "SW-IN:Ethernet4", mode: access, vlan: 902, role: "Transit pare-feux (SW-IN)"}
      Gi0/2: {to: "CORE-B:Gi0/2", mode: portchannel, channel: 1, role: "ISL Po1 LACP #1"}
      Gi0/3: {to: "CORE-B:Gi0/3", mode: portchannel, channel: 1, role: "ISL Po1 LACP #2"}
      Gi1/0: {to: "LEAF-A1:Gi0/0", mode: trunk, role: "Uplink Hall A"}
      Gi1/1: {to: "LEAF-A2:Gi0/0", mode: trunk, role: "Uplink Hall A"}
      Gi1/2: {to: "LEAF-B1:Gi0/0", mode: trunk, role: "Uplink Hall B"}
      Gi1/3: {to: "LEAF-B2:Gi0/0", mode: trunk, role: "Uplink Hall B"}
      Gi2/0: {to: "SW-MGMT:Ethernet4", mode: mgmt, role: "OOB VLAN 10"}
  CORE-B:
    role: core
    platform: iosvl2
    tia: MDA
    loopback: 10.255.0.22
    mgmt: {ip: 10.10.0.22, port: Gi2/0}
    svi_host: 3
    hsrp_active_priority: 110
    hsrp_standby_priority: 90
    ports:
      Gi0/0: {to: "SW-IN:Ethernet5", mode: access, vlan: 902, role: "Transit pare-feux (SW-IN)"}
      Gi0/2: {to: "CORE-A:Gi0/2", mode: portchannel, channel: 1, role: "ISL Po1 LACP #1"}
      Gi0/3: {to: "CORE-A:Gi0/3", mode: portchannel, channel: 1, role: "ISL Po1 LACP #2"}
      Gi1/0: {to: "LEAF-A1:Gi0/1", mode: trunk, role: "Uplink Hall A"}
      Gi1/1: {to: "LEAF-A2:Gi0/1", mode: trunk, role: "Uplink Hall A"}
      Gi1/2: {to: "LEAF-B1:Gi0/1", mode: trunk, role: "Uplink Hall B"}
      Gi1/3: {to: "LEAF-B2:Gi0/1", mode: trunk, role: "Uplink Hall B"}
      Gi2/0: {to: "SW-MGMT:Ethernet5", mode: mgmt, role: "OOB VLAN 10"}

  LEAF-A1:
    role: leaf
    platform: iosvl2
    tia: HDA-A
    hall: A
    loopback: 10.255.0.31
    mgmt: {ip: 10.10.0.31, port: Gi1/2}
    ports:
      Gi0/0: {to: "CORE-A:Gi1/0", mode: trunk, role: "Uplink CORE-A"}
      Gi0/1: {to: "CORE-B:Gi1/0", mode: trunk, role: "Uplink CORE-B"}
      Gi0/2: {to: "SRV-CMP-01:eth0", mode: access, vlan: 20, role: "Serveur NIC0"}
      Gi0/3: {to: "SRV-CMP-02:eth0", mode: access, vlan: 20, role: "Serveur NIC0"}
      Gi1/0: {to: "SRV-CMP-03:eth0", mode: access, vlan: 20, role: "Serveur NIC0"}
      Gi1/1: {to: "SRV-STO-01:eth0", mode: access, vlan: 30, role: "Serveur NIC0"}
      Gi1/2: {to: "SW-MGMT:Ethernet6", mode: mgmt, role: "OOB VLAN 10"}
  LEAF-A2:
    role: leaf
    platform: iosvl2
    tia: HDA-A
    hall: A
    loopback: 10.255.0.32
    mgmt: {ip: 10.10.0.32, port: Gi1/2}
    ports:
      Gi0/0: {to: "CORE-A:Gi1/1", mode: trunk, role: "Uplink CORE-A"}
      Gi0/1: {to: "CORE-B:Gi1/1", mode: trunk, role: "Uplink CORE-B"}
      Gi0/2: {to: "SRV-CMP-01:eth1", mode: access, vlan: 20, role: "Serveur NIC1"}
      Gi0/3: {to: "SRV-CMP-02:eth1", mode: access, vlan: 20, role: "Serveur NIC1"}
      Gi1/0: {to: "SRV-CMP-03:eth1", mode: access, vlan: 20, role: "Serveur NIC1"}
      Gi1/1: {to: "SRV-STO-01:eth1", mode: access, vlan: 30, role: "Serveur NIC1"}
      Gi1/2: {to: "SW-MGMT:Ethernet7", mode: mgmt, role: "OOB VLAN 10"}
  LEAF-B1:
    role: leaf
    platform: iosvl2
    tia: HDA-B
    hall: B
    loopback: 10.255.0.33
    mgmt: {ip: 10.10.0.33, port: Gi1/3}
    ports:
      Gi0/0: {to: "CORE-A:Gi1/2", mode: trunk, role: "Uplink CORE-A"}
      Gi0/1: {to: "CORE-B:Gi1/2", mode: trunk, role: "Uplink CORE-B"}
      Gi0/2: {to: "SRV-BCK-01:eth0", mode: access, vlan: 40, role: "Serveur NIC0"}
      Gi0/3: {to: "SRV-INF-01:eth0", mode: access, vlan: 100, role: "Serveur NIC0"}
      Gi1/0: {to: "SRV-MON-01:eth0", mode: access, vlan: 60, role: "Serveur NIC0"}
      Gi1/1: {to: "SRV-DCIM-01:eth0", mode: access, vlan: 70, role: "Serveur NIC0"}
      Gi1/2: {to: "SYSLOG:eth0", mode: access, vlan: 60, role: "Service syslog"}
      Gi1/3: {to: "SW-MGMT:Ethernet8", mode: mgmt, role: "OOB VLAN 10"}
  LEAF-B2:
    role: leaf
    platform: iosvl2
    tia: HDA-B
    hall: B
    loopback: 10.255.0.34
    mgmt: {ip: 10.10.0.34, port: Gi2/0}
    ports:
