      Gi1/3: {to: "CCTV-SIM:eth0", mode: access, vlan: 80, role: "Simulateur CCTV"}
      Gi2/0: {to: "SW-MGMT:Ethernet9", mode: mgmt, role: "OOB VLAN 10"}

# GNS3 built-in switches (zero RAM). type: access | dot1q (vlan = native/access VLAN, carried VLANs listed)
lab_switches:
  # SW-IN (PLAN_02 FW.3, 10 Nov 2026): VLAN 902 firewall <-> core transit as one L2 segment. With direct links a core
  # that stops or hangs keeps its GNS3 link "up", the firewall lagg (failover) stays on it and the LAN side is cut
  # (measured >= 150 s). Here both lagg members of each firewall and one port of each core share the segment, so the
  # HSRP 902 gateway moves to the other core in 3 s. VLAN 902 is then removed from the core ISL Po1 (no L2 loop for
  # loop guard to block). In production: an MLAG/vPC core pair or two transit switches.
  SW-IN:   {tia: MDA, ports: {Ethernet0: {vlan: 902, to: "FW-A:em3"}, Ethernet1: {vlan: 902, to: "FW-A:em4"}, Ethernet2: {vlan: 902, to: "FW-B:em3"}, Ethernet3: {vlan: 902, to: "FW-B:em4"}, Ethernet4: {vlan: 902, to: "CORE-A:Gi0/0"}, Ethernet5: {vlan: 902, to: "CORE-B:Gi0/0"}}}
  SW-OUT:  {tia: ER,  ports: {Ethernet0: {vlan: 901, to: "EDGE-A:Gi0/3"}, Ethernet1: {vlan: 901, to: "EDGE-B:Gi0/3"}, Ethernet2: {vlan: 901, to: "FW-A:em0"}, Ethernet3: {vlan: 901, to: "FW-B:em0"}}}
  SW-DMZ:  {tia: MDA, ports: {Ethernet0: {vlan: 50, to: "FW-A:em5"}, Ethernet1: {vlan: 50, to: "FW-B:em5"}, Ethernet2: {vlan: 50, to: "SRV-WEB-01:eth0"}}}
  SW-MGMT:
    tia: MDA
    ports:
      Ethernet0:  {vlan: 10, to: "EDGE-A:Gi0/5"}
      Ethernet1:  {vlan: 10, to: "EDGE-B:Gi0/5"}
      Ethernet2:  {type: dot1q, vlan: 1, carries: [10, 90], to: "FW-A:em6"}
      Ethernet3:  {type: dot1q, vlan: 1, carries: [10, 90], to: "FW-B:em6"}
      Ethernet4:  {vlan: 10, to: "CORE-A:Gi2/0"}
      Ethernet5:  {vlan: 10, to: "CORE-B:Gi2/0"}
      Ethernet6:  {vlan: 10, to: "LEAF-A1:Gi1/2"}
      Ethernet7:  {vlan: 10, to: "LEAF-A2:Gi1/2"}
      Ethernet8:  {vlan: 10, to: "LEAF-B1:Gi1/3"}
      Ethernet9:  {vlan: 10, to: "LEAF-B2:Gi2/0"}
      Ethernet10: {vlan: 90, to: "SRV-BASTION:eth0"}
      Ethernet11: {vlan: 90, to: "ADMIN-WS:eth0"}

