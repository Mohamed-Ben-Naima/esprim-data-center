  role: preuve de restauration
  test: fichier relu depuis le snapshot ZFS
  vo: 'Une sauvegarde ne vaut que si on sait la relire. Test : le même fichier, dans la copie et dans le dernier snapshot
    ZFS. Résultat : {restore_result}.'
- id: fin
  act: 9
  card: end
  vo: 'Tout ce que vous avez vu est réel et rejouable : les configurations sont générées depuis l''inventaire, et la campagne
