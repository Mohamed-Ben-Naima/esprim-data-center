  act: 2
  rec: A2_net
  mark: a2_leafa
  node: LEAF-A1
  role: commutateur d'accès, salle A
  test: show interfaces trunk · show interfaces status
  vo: 'LEAF-A1 dessert la salle A ; chaque serveur y est relié deux fois, à LEAF-A1 et à LEAF-A2. Test : les trunks et les
