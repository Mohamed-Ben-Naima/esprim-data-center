  act: 2
  rec: A2_switch
  mark: a2_switch
  node: GNS3 · profil calcul
  role: changement de profil
  test: 'clic droit › Start : salle A'
  vo: 'Deuxième acte, le calcul, en direct. Nouveau redémarrage de la VM GNS3, puis dans GNS3 : FW-A, CORE-A, les deux commutateurs
    de la salle A, le site web et deux serveurs de calcul. Accéléré.'
  until: a2_done
  speed: auto
