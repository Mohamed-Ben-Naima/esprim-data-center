  mark: a2_t5
  node: Panne T5 · SRV-CMP-01
  role: haute disponibilité applicative
  test: arrêt de SRV-CMP-01, sonde toutes les 0,5 s depuis la DMZ
  vo: 'Panne T5 : on arrête SRV-CMP-01 pendant que le site web interroge le service toutes les demi-secondes. Résultat :
