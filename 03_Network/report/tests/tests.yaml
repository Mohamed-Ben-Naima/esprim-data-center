# =====================================================================================================
#  Test the Lab - one entry per test. Source of report/Test_the_Lab.pdf
#  (python report/_source/build_lab_guide.py test_the_lab).
#  verified: date of the last run that gave the expected result, or null when the test was never run.
#  Never set a date for a test that was not actually run. Passwords are not written here: see the inventory.
#  limit: text  -> the test does not pass and this is accepted and documented as a limit of the lab.
# =====================================================================================================
updated: 2026-11-10

sections:
  - id: PLT
    title: Platform
    needs: "GNS3 VM running"
    tests:
      - id: PLT-01
        proves: The GNS3 VM answers on its management address
        from: Windows host
        command: ping -n 2 192.168.75.128
        expected: 2 replies
        verified: 2026-10-12
      - id: PLT-02
        proves: The controller reaches the VM and knows the state of every node
        from: Windows host, folder 03_Network
        command: python automation/labctl.py status
        expected: 31 lines; the nodes you started show "started"
        verified: 2026-10-12
      - id: PLT-03
        proves: No node disk is damaged (run after any host disk incident)
        from: Windows host, folder 03_Network
        command: python automation/gns3vm.py --sudo -f automation/check_disks.sh
        expected: '"No errors were found on the image" on each line, then "images with problems: 0"'
        verified: 2026-10-12

      - id: PLT-04
        proves: The filesystem inside a server disk is clean (qemu-img check does not look inside)
        from: Windows host, folder 03_Network; the nodes must be stopped
        command: python automation/fsck_servers.py SRV-BASTION SRV-CMP-01
        expected: '"e2fsck exit 0" for each node. Exit 4 means errors: repair with --repair.'
        verified: 2026-10-12
      - id: PLT-05
        proves: Windows does not spin the VM disk down or suspend its USB link on mains power
        from: Windows host, PowerShell
        command: |-
          powercfg /query SCHEME_CURRENT 0012ee47-9041-4b5d-9b77-535fba8b1442 6738e2c4-e8a5-4a42-b16a-e040e769756e
          powercfg /query SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226
        expected: "AC index 0x00000000 on both: disk turn-off never, USB selective suspend off"
        verified: 2026-10-12
      - id: PLT-06
        proves: The external disk holding the VM had no error in the last hour
        from: Windows host, PowerShell
        command: |-
          (Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=(Get-Date).AddMinutes(-60)} |
            Where-Object { $_.ProviderName -match '^disk$|^Ntfs$' -and $_.Id -in 50,51 } | Measure-Object).Count
        expected: "0"
        verified: 2026-10-12

  - id: EDGE
    title: Providers and edge routers
    needs: "NAT-A, NAT-B, ISP-A, ISP-B, SW-OUT, EDGE-A, EDGE-B"
    tests:
      - id: EDGE-01
        proves: EDGE-A has its three BGP sessions (ISP-A, ISP-B, EDGE-B)
        from: EDGE-A console (telnet 192.168.75.128 5004)
        command: show ip bgp summary
        expected: 3 neighbours with a number in the last column (2, 1, 1). EDGE-B shows Idle until it has finished booting.
        verified: 2026-10-12
      - id: EDGE-02
        proves: EDGE-B has its three BGP sessions
        from: EDGE-B console (5006)
        command: show ip bgp summary
        expected: 3 neighbours with a number in the last column
        verified: 2026-10-12
      - id: EDGE-03
        proves: EDGE-A holds the virtual gateway offered to the firewalls
        from: EDGE-A console (5004)
        command: show standby brief
        expected: Gi0/3 group 1 Active, standby 10.254.1.3, virtual IP 10.254.1.6
        verified: 2026-10-12
      - id: EDGE-04
        proves: The edge reaches the real Internet through its provider
        from: EDGE-A console (5004)
        command: ping 8.8.8.8 repeat 5
        expected: '"!!!!!", success rate 100 percent'
        verified: 2026-10-12
      - id: EDGE-05
        proves: OSPF is up between the two edges
        from: EDGE-A console (5004)
        command: show ip ospf neighbor
        expected: 2 lines FULL (Gi0/2 and Gi0/3)
        verified: 2026-10-07
      - id: EDGE-06
        proves: The provider sees both edges and receives our prefix
        from: ISP-A auxiliary console (5037)
        command: vtysh -c "show ip bgp summary"
        expected: 2 neighbours (EDGE-A, EDGE-B), PfxRcd 1 each
        verified: 2026-10-12
      - id: EDGE-07
        proves: The provider container reaches the real Internet
        from: ISP-A auxiliary console (5037)
        command: ping -c 2 8.8.8.8
        expected: 0% packet loss
        verified: 2026-10-12

  - id: FW
    title: Firewalls
    needs: "SW-OUT, SW-DMZ, SW-MGMT, FW-A, FW-B (edge tier for FW-04 and FW-06)"
    tests:
      - id: FW-01
        proves: FW-A is master of the five virtual addresses
        from: FW-A shell (VNC 192.168.75.128:5900, option 8)
        command: "ifconfig | grep carp:"
        expected: 5 lines "carp MASTER" (vhid 1, 2, 10, 50, 90), advskew 0
        verified: 2026-10-12
      - id: FW-02
        proves: FW-B is backup of the five virtual addresses
        from: FW-B shell (VNC 5901, option 8)
        command: "ifconfig | grep carp:"
        expected: 5 lines "carp BACKUP", advskew 100
        verified: 2026-10-12
      - id: FW-03
        proves: The session table is replicated between the firewalls
        from: FW-A shell, then FW-B shell
        command: ifconfig pfsync0 | grep syncdev
        expected: syncdev em2, syncpeer 10.254.3.2 on FW-A and 10.254.3.1 on FW-B
        verified: 2026-10-12
      - id: FW-04
        proves: The master firewall reaches the Internet through the edge
        from: FW-A shell
        command: ping -c 2 8.8.8.8
        expected: 0.0% packet loss. On the backup it fails, which is normal.
        verified: 2026-10-12
      - id: FW-05
        proves: The web interface of each firewall opens on its dashboard
        from: host browser through the proxy (see WEB-01)
        command: |-
          open https://10.90.0.1 (master) and https://10.90.0.3 (FW-B)
          login admin + administrator password
        expected: page "fw-a.dc.casa.lab - Status Dashboard" (fw-b on .3), no setup wizard
        verified: 2026-10-12
      - id: FW-06
        proves: The public web site is published to the Internet side (BGP, static route, port forward, WAN rule)
        from: ISP-A auxiliary console (5037)
        command: printf 'GET /health HTTP/1.0\r\n\r\n' | nc -w 5 192.0.2.80 80
        expected: '"HTTP/1.1 200 OK" and "OK SRV-WEB-01"'
        verified: 2026-10-12

      - id: FW-07
        proves: Both live firewalls run exactly the configuration generated from the inventory
        from: Windows host, folder 03_Network (ADMIN-WS, FW-A and FW-B running)
        command: python automation/fw_audit.py
        expected: 'every line "[ok]" for FW-A and FW-B (12 configuration sections, 32/32 rules loaded in pf, NAT, CARP roles, no setup wizard), last line "0 difference(s)"'
        verified: 2026-10-12
      - id: FW-08
        proves: A command can be run on a firewall by the administrator path (SSH from ADMIN-WS)
        from: Windows host, folder 03_Network
        command: python automation/adminws.py fw-a "pfctl -sr | wc -l"
        expected: the number of loaded pf lines (165 on 12 Oct), the same on fw-b
        verified: 2026-10-12

      - id: FW-09
        proves: A change of the inventory reaches both firewalls without reboot, and nothing else changes
        from: Windows host, folder 03_Network
        command: |-
          python automation/gen_pfsense.py
          python automation/deploy_pfsense.py
          python automation/fw_audit.py
        expected: 'for FW-B then FW-A: "transferred, checksum identical, XML valid, hostname matches" and "installed"; then the audit ends with "0 difference(s)"'
        verified: 2026-10-12
      - id: FW-10
        proves: Rule EXT-8 lets the administration zone reach the Zabbix server port, and only that port
        from: SRV-BASTION (ssh bastion from ADMIN-WS), then FW-A shell
        command: |-
          timeout 4 bash -c '</dev/tcp/10.60.0.11/10051'; timeout 4 bash -c '</dev/tcp/10.60.0.11/3306'
          pfctl -vvsr | grep -A1 EXT-8
          grep ',10.90.0.11,10.60.0.11,' /var/log/filter.log | tail -1
        expected: 'the "Packets:" counter of EXT-8 rises after the first attempt; the second attempt leaves a line "em6.90,match,block,in ... 3306"'
        verified: 2026-10-12
      - id: FW-11
        proves: The same policy applies when FW-B is the master
        from: FW-A shell, then SRV-BASTION, then FW-B shell
        command: |-
          sysctl net.inet.carp.demotion=240        (on FW-A: FW-B becomes master of the five addresses)
          ... repeat FW-10, reading the counter and the log on FW-B ...
          sysctl net.inet.carp.demotion=-240       (on FW-A: back to normal)
        expected: 'FW-B shows 5 x MASTER; the EXT-8 counter rises on FW-B and not on FW-A; the block is in the log of FW-B; after the last command FW-A is 5 x MASTER again and "net.inet.carp.demotion: 0"'
        verified: 2026-10-12
      - id: FW-12
        proves: The web interface of the firewalls closes idle sessions after 15 minutes
        from: Windows host, folder 03_Network
        command: python automation/fw_audit.py
        expected: 'line "[ok] web session timeout: 15 min (generated: 15 min)" for FW-A and FW-B'
        verified: 2026-10-12
      - id: FW-13
        proves: The Zabbix server port is really open end to end from the bastion (needs SRV-MON-01 running)
        from: SRV-BASTION (ssh bastion from ADMIN-WS)
        command: timeout 3 bash -c '</dev/tcp/10.60.0.11/10051' && echo open
        expected: open
        verified: null
      - id: FW-14
        proves: A core that stops does not cut the internal side of the firewalls for long (SW-IN, plan 02 FW.3)
        from: Windows host, folder 03_Network (evidence report/evidence/fw_lan_failover.txt)
        command: python automation/fw_lan_failover.py --core CORE-A --down 40 --up 200   (then --core CORE-B)
        expected: 'outage about 4.5 s for either core (was >= 150 s with direct cables), 0-1.5 s at the restart'
        verified: 2026-11-10
      - id: FW-15
        proves: VLAN 902 is one segment on SW-IN and no longer crosses the core port-channel
        from: ADMIN-WS terminal (ssh core-a / core-b)
        command: show standby brief | include Vl902 ; show running-config interface Port-channel1 | include allowed
        expected: CORE-A Active and CORE-B Standby for group 902 (hellos over SW-IN); allowed list without 902
        verified: 2026-11-10

  - id: CORE
    title: Core and leaf switches
    needs: "CORE-A, CORE-B, LEAF-B1, LEAF-B2 (firewalls and edge tier for CORE-06)"
    tests:
      - id: CORE-01
        proves: CORE-A is the gateway of its VLANs
        from: CORE-A console (5010)
        command: show standby brief
        expected: Active on Vl20, Vl40, Vl60, Vl100, Vl902; Standby on Vl30, Vl70, Vl80
        verified: 2026-10-12
      - id: CORE-02
        proves: CORE-B is the gateway of the other VLANs
        from: CORE-B console (5012)
        command: show standby brief
        expected: Active on Vl30, Vl70, Vl80; Standby on the others
        verified: 2026-10-12
      - id: CORE-03
        proves: The two links between the cores are bundled by LACP
        from: CORE-A console (5010)
        command: show etherchannel summary | begin Group
        expected: Po1(SU) with Gi0/2(P) Gi0/3(P). Shows (SD) while CORE-B is still booting.
        verified: 2026-10-12
      - id: CORE-04
        proves: OSPF is up between the cores
        from: CORE-B console (5012)
        command: show ip ospf neighbor
        expected: 2 lines FULL (Vlan998 and Vlan902)
        verified: 2026-10-12
      - id: CORE-05
        proves: The spanning-tree root of each VLAN is its active gateway
        from: CORE-A console (5010)
        command: show spanning-tree root
        expected: no root port for VLAN 20, 40, 60, 100, 902, 998 (CORE-A is root); root port Po1 for 30, 70, 80
        verified: 2026-10-12
      - id: CORE-06
        proves: The whole chain core, firewall, NAT, edge, provider works
        from: CORE-A console (5010)
        command: ping 8.8.8.8 source vlan20 repeat 5
        expected: '"!!!!!", source address 10.20.0.2'
        verified: 2026-10-12
      - id: CORE-07
        proves: Each leaf uplink forwards the VLANs of "its" core
        from: LEAF-B1 console (5018) and LEAF-B2 console (5020)
        command: show interfaces trunk | begin Vlans in spanning
        expected: Gi0/0 forwards 20,40,60,100; Gi0/1 forwards 30,70,80
        verified: 2026-10-12

  - id: INF
    title: DNS and NTP server (SRV-INF-01)
    needs: "SRV-INF-01 and its path: LEAF-B1/B2, cores; firewalls and edge tier for INF-03 to INF-05"
    tests:
      - id: INF-01
        proves: The server is attached to both leafs (bond active-backup)
        from: SRV-INF-01 console (5032), login ubuntu, then sudo -i
        command: grep -E 'Mode|Active Slave|MII Status' /proc/net/bonding/bond0
        expected: active-backup, one active slave, "MII Status up" three times
        verified: 2026-10-12
      - id: INF-02
        proves: DNS and NTP services run
        from: SRV-INF-01 console (5032)
        command: systemctl is-active dnsmasq chrony
        expected: active, active
        verified: 2026-10-12
      - id: INF-03
        proves: The site DNS resolves an Internet name
        from: SRV-INF-01 console (5032)
        command: dig +short +time=3 @10.100.0.11 deb.debian.org
        expected: at least one IP address
        verified: 2026-10-12
      - id: INF-04
        proves: The site clock is synchronised on public time servers
        from: SRV-INF-01 console (5032)
        command: chronyc sources
        expected: several sources, one marked "^*"
        verified: 2026-10-12
      - id: INF-05
        proves: An internal server reaches the Internet (allowed flow)
        from: SRV-INF-01 console (5032)
        command: ping -c 2 -W 2 8.8.8.8
        expected: 0% packet loss
        verified: 2026-10-12
      - id: INF-06
        proves: An internal server cannot reach the management network (forbidden flow)
        from: SRV-INF-01 console (5032), then CORE-A console (5010)
        command: |-
          ping -c 2 -W 2 10.10.0.21
          show access-lists ACL-VLAN100-IN | include deny
        expected: 100% packet loss; the line "deny ip any 10.10.0.0" shows matches
        verified: 2026-10-12

  - id: LOG
    title: Log collection server (SYSLOG)
    needs: "SYSLOG, LEAF-B1, cores; firewalls for the logs of the network devices"
    tests:
      - id: LOG-01
        proves: Every equipment sends its logs to the collector
        from: SYSLOG auxiliary console (5041)
        command: ls /var/log/remote/
        expected: one file per source (10 network devices 10.10.0.x, servers, simulators) plus all.log; 15 files on 12 Oct
        verified: 2026-10-12
      - id: LOG-02
        proves: Logs arrive live
        from: SYSLOG auxiliary console (5041)
        command: tail -3 /var/log/remote/all.log
        expected: lines of the last seconds
        verified: 2026-10-12
      - id: LOG-03
        proves: Every running equipment reaches the collector (marker sent and found)
        from: Windows host, folder 03_Network
        command: python automation/syslog_audit.py
        expected: 'marker "OK" for every running Cisco device, firewall, server and the NAS (6/6 in the nas profile); simulators "events"'
        verified: 2026-11-10
      - id: LOG-04
        proves: The log viewer answers in HTTPS from the administration zone and asks for a login
        from: ADMIN-WS browser (portal entry "Journaux (syslog)")
        command: https://10.60.0.12/ , login netadmin
        expected: 'login page, then the last lines of all sources and the source table (refused from the DMZ, access matrix); Zabbix web.test.fail[Lecteur de journaux] = 0' 
        verified: 2026-11-10
      - id: LOG-05
        proves: A failed login, a configuration change and a firewall block are found in the viewer
        from: Windows host, folder 03_Network (evidence report/evidence/demo_s5_log_viewer.txt)
        command: python automation/log_viewer.py demo
        expected: '%SEC_LOGIN-4-LOGIN_FAILED, %SYS-5-CONFIG_I "by netadmin on vty0 (10.90.0.12)", filterlog block 10.50.0.11,10.10.0.21 port 22 (rule T18-9), each within a few seconds'
        verified: 2026-11-10
      - id: LOG-06
        proves: The viewer cannot change the logs and locks a password guesser
        from: Windows host, folder 03_Network
        command: python automation/build_images.py syslog ; python automation/log_viewer.py lock
        expected: 'self-test "viewer not running as root", "cannot write", "cannot delete", "PUT refused" ok; 401 x5 then 429'
        verified: 2026-11-10
      - id: LOG-07
        proves: Logs are rotated daily, compressed and still searchable
        from: SYSLOG (docker exec) then Windows host
        command: logrotate -f /etc/logrotate.d/remote ; python automation/log_viewer.py search LOGIN_FAILED --src CORE-A --arch
        expected: 119 MB -> 10 MB (one .gz per source), new lines keep arriving, old lines found with --arch
        verified: 2026-11-10

  - id: ADM
    title: Administration zone (VLAN 90)
    needs: "SW-MGMT, FW-A, FW-B, cores, LEAF-B1/B2, SRV-BASTION, BMS-SIM, SRV-DCIM-01, SRV-WEB-01"
    tests:
      - id: ADM-01
        proves: The administration zone reaches the power dashboard
        from: SRV-BASTION console (5036), login ubuntu, then sudo -i
        command: curl -s -m 5 http://10.70.0.12:8080/api/state
        expected: 5 elements UP, paths A and B POWERED, load 47.1 % each
        verified: 2026-10-12
      - id: ADM-02
        proves: The administration zone reaches the DCIM
        from: SRV-BASTION console (5036)
        command: curl -s -m 5 http://10.70.0.11:8080/api/summary
        expected: racks 96, by_status OK 96
        verified: 2026-10-12
      - id: ADM-03
        proves: The administration zone reaches the firewall web interface
        from: SRV-BASTION console (5036)
        command: curl -sk -m 5 -o /dev/null -w '%{http_code}\n' https://10.90.0.1/
        expected: "200"
        verified: 2026-10-12
      - id: ADM-04
        proves: The administration zone reaches the DMZ web site in HTTPS
        from: SRV-BASTION console (5036)
        command: curl -sk -m 5 https://10.50.0.11/health
        expected: OK SRV-WEB-01 (TLS)
        verified: 2026-10-12
      - id: ADM-05
        proves: SSH to the network devices is open from the administration zone
        from: SRV-BASTION console (5036)
        command: |-
          timeout 3 bash -c '</dev/tcp/10.10.0.21/22' && echo open
          timeout 3 bash -c '</dev/tcp/10.10.0.1/22' && echo open
        expected: open, open (CORE-A and EDGE-A). An interactive login is not tested yet.
        verified: 2026-10-12
      - id: ADM-06
        proves: The bastion audits sessions and offers SSH
        from: SRV-BASTION console (5036)
        command: systemctl is-active auditd ssh
        expected: active, active
        verified: 2026-10-12

  - id: WT
    title: Administration webterm (ADMIN-WS)
    needs: "SW-MGMT, FW-A, FW-B, ADMIN-WS and the target; SYSLOG, LEAF-B1 and the cores for WT-05"
    tests:
      - id: WT-01
        proves: The webterm has the administration tools
        from: ADMIN-WS auxiliary console (telnet 192.168.75.128 5053)
        command: command -v ssh firefox-esr curl snmpget dig nc
        expected: six paths; ssh is /usr/local/bin/ssh (the logging wrapper)
        verified: 2026-10-12
      - id: WT-02
        proves: An administrator opens a real SSH session on a network device by its alias
        from: ADMIN-WS terminal (VNC 192.168.75.128:5904, desktop menu > Terminal)
        command: ssh core-a "show version | include uptime"
        expected: legal banner, password prompt, then "CORE-A uptime is ...". Same for edge-a and leaf-b1.
        verified: 2026-10-12
      - id: WT-03
        proves: The firewalls are administered by SSH from the same place
        from: ADMIN-WS terminal (VNC 5904)
        command: ssh fw-a "hostname; pfctl -sr | wc -l"
        expected: fw-a.dc.casa.lab and the number of loaded rules (165 on 12 Oct)
        verified: 2026-10-12
      - id: WT-04
        proves: The browser opens on the portal that lists every web interface and SSH alias
        from: ADMIN-WS desktop (VNC 5904)
        command: open Firefox (it starts with the desktop)
        expected: 'page "DC-CASA - administration portal" with 8 web interfaces and one SSH line per equipment'
        verified: 2026-10-12
      - id: WT-05
        proves: Every SSH session from the webterm is recorded on the log collector
        from: SYSLOG auxiliary console (5041)
        command: grep admin-ssh /var/log/remote/all.log | tail -2
        expected: 'a "session start" and a "session end ... rc=0" line with the target'
        verified: 2026-10-12
      - id: WT-06
        proves: The list of aliases is at hand in the terminal
        from: ADMIN-WS terminal or auxiliary console (5053)
        command: dc-hosts
        expected: one line "ssh <alias>  <user>@<address>" per equipment
        verified: 2026-10-12
      - id: WT-07
        proves: The webterm shows the same local time as the log collector
        from: ADMIN-WS auxiliary console (5053), then SYSLOG auxiliary console (5041)
        command: date
        expected: same hour on both
        verified: null
        limit: 'Known lab limit (accepted 12 Oct 2026): both use the zone Africa/Casablanca, but ADMIN-WS shows +00 and SYSLOG +01 because the two images carry different time-zone databases. Log lines are stamped by the collector, so the order of events is not affected.'

  - id: ACC
    title: Access matrix (who can administer what, and from where)
    needs: "ADMIN-WS, SRV-INF-01, SRV-WEB-01, firewalls, cores, LEAF-B1/B2 and every equipment you want in the matrix"
    tests:
      - id: ACC-01
        proves: Every running equipment is administered from ADMIN-WS and refused from an internal network and from the DMZ
        from: Windows host, folder 03_Network
        command: python automation/access_matrix.py --login
        expected: 'each running target "reachable" from ADMIN-WS with an SSH answer, "refused" from SRV-INF-01 and SRV-WEB-01 (the public web site is reachable internally by design); last line "0 failure(s)"; stopped equipment shown "not running"'
        verified: 2026-10-12
      - id: ACC-02
        proves: SSH is enabled on a switch (a switch without RSA keys refuses port 22)
        from: LEAF-B2 console (5020), or any Cisco console
        command: show ip ssh
        expected: '"SSH Enabled - version 2.0". If "SSH Disabled": conf t, crypto key generate rsa modulus 2048, end, write memory'
        verified: 2026-10-12
      - id: ACC-03
        proves: A refused attempt from an internal network is counted by the core
        from: CORE-A console (5010), after ACC-01
        command: show access-lists ACL-VLAN100-IN | include deny
        expected: the lines "deny ip any 10.10.0.0" and "deny ip any 10.90.0.0" show matches, more than before the run
        verified: 2026-10-12
      - id: ACC-04
        proves: A refused attempt from the DMZ is logged by the firewall on the central collector
        from: SYSLOG auxiliary console (5041), after ACC-01
        command: grep filterlog /var/log/remote/all.log | grep ",10.50.0.11,10.10.0" | tail -2
        expected: 'lines "em5,match,block,in ... tcp ... 10.50.0.11,10.10.0.x,...,22"'
        verified: 2026-10-12

  - id: PRV
    title: Privileged access rules
    needs: "ADMIN-WS, SRV-BASTION, firewalls, the target device, SYSLOG and its path"
    tests:
      - id: PRV-01
        proves: A device is reached through the jump host, and each hop records it
        from: ADMIN-WS terminal (VNC 5904)
        command: ssh -J bastion core-a "show users"
        expected: 'banner of SRV-BASTION, then the answer of CORE-A. On SYSLOG: "LOGIN_SUCCESS ... Source: 10.90.0.11" in the file of 10.10.0.21'
        verified: 2026-10-12
      - id: PRV-02
        proves: Repeated wrong passwords lock the device against every SSH login for a while
        from: ADMIN-WS terminal (VNC 5904)
        command: |-
          ssh leaf-b2      (wrong password, three times in a row)
          ssh leaf-b2      (right password)
        expected: '"Connection refused" from the fifth failed authentication, also with the right password; accepted again after the quiet period (120 s on the device clock, about 4 min in real time on this host)'
        verified: 2026-10-12
      - id: PRV-03
        proves: The lockout is reported to the log collector
        from: SYSLOG auxiliary console (5041)
        command: grep -E "SEC_LOGIN|QUIET" /var/log/remote/10.10.0.34_*.log | tail -5
        expected: 'lines "LOGIN_FAILED ... Source: 10.90.0.12" then "QUIET_MODE_ON"'
        verified: 2026-10-12
      - id: PRV-04
        proves: An idle administration session is closed by the device
        from: LEAF-B1 console (5018) for the setting; ADMIN-WS for the behaviour
        command: |-
          show line vty 0 | begin Timeouts
          ssh edge-a       (then type nothing)
        expected: 'Idle EXEC 00:10:00; the session is closed by the device ("Connection to ... closed by remote host"). EDGE-A closed an idle session by itself after 634 s of real time (10 min on its clock); LEAF-B1 had not closed it after 840 s because its clock runs slow (known lab limit).'
        verified: 2026-10-12

      - id: PRV-05
        proves: The image default account cannot open an SSH session any more
        from: ADMIN-WS terminal (VNC 5904)
        command: |-
          ssh ubuntu@10.90.0.11
          ssh ubuntu@10.100.0.11
        expected: '"Permission denied" on both, whatever the password'
        verified: 2026-10-12
      - id: PRV-06
        proves: Servers are administered with the named account
        from: ADMIN-WS terminal (VNC 5904)
        command: ssh srv-inf-01 hostname
        expected: 'password of sysadmin asked, then "srv-inf-01"'
        verified: 2026-10-12
      - id: PRV-07
        proves: The bastion asks for a second factor and refuses a wrong code
        from: ADMIN-WS terminal (VNC 5904); the code comes from "python automation/totp.py" on the host
        command: |-
          ssh bastion       (right password, code 000000)
          ssh bastion       (right password, current code)
        expected: 'two questions each time: "Password:" then "Verification code:". Wrong code: "Permission denied". Right code: session opened. A code cannot be used twice.'
        verified: 2026-10-12
      - id: PRV-08
        proves: The second factor is recorded on the log collector
        from: SYSLOG auxiliary console (5041)
        command: grep -h google_authenticator /var/log/remote/10.90.0.11_*.log | tail -2
        expected: '"Accepted google_authenticator for sysadmin"'
        verified: 2026-10-12
      - id: PRV-09
        proves: The jump through the bastion needs the second factor too
        from: ADMIN-WS terminal (VNC 5904)
        command: ssh -J bastion core-a "show version | include uptime"
        expected: 'three questions (bastion password, verification code, device password), then "CORE-A uptime is ..."'
        verified: 2026-10-12

  - id: PWR
    title: Power simulator and DCIM (scenario T6)
    needs: "BMS-SIM, SRV-DCIM-01, SYSLOG, LEAF-B1/B2, cores, firewalls, SRV-BASTION (or the proxy)"
    tests:
      - id: PWR-01
        proves: Losing power path A is detected and path B takes the whole load
        from: SRV-BASTION console (5036)
        command: curl -s 'http://10.70.0.12:8080/api/set?UTILITY-A=DOWN&UPS-A=DOWN&GENERATOR=DOWN'
        expected: paths A DOWN and B POWERED, path B load 94.2 %, status CRITICAL
        verified: 2026-10-12
      - id: PWR-02
        proves: The DCIM follows within its 10 s polling period
        from: SRV-BASTION console (5036), about 15 s later
        command: curl -s http://10.70.0.11:8080/api/summary
        expected: by_status DEGRADED 96, bms_status CRITICAL
        verified: 2026-10-12
      - id: PWR-03
        proves: The state change is logged centrally
        from: SYSLOG auxiliary console (5041)
        command: grep -i bms /var/log/remote/all.log | tail -5
        expected: lines "BMS-SIM bms" with the alarms raised and cleared
        verified: 2026-10-12
      - id: PWR-04
        proves: Restoring power clears the alarm (always run after PWR-01)
        from: SRV-BASTION console (5036)
        command: |-
          curl -s http://10.70.0.12:8080/api/reset
          curl -s http://10.70.0.11:8080/api/summary
        expected: both paths POWERED at 47.1 %; after 15 s by_status OK 96
        verified: 2026-10-12

  - id: MON
    title: Monitoring server (SRV-MON-01)
    needs: "SRV-MON-01, LEAF-B1/B2, cores. Do not run it together with hall A or the undeployed servers."
    tests:
      - id: MON-01
        proves: The Zabbix stack runs
        from: SRV-MON-01 console (5034), login ubuntu, then sudo -i
        command: systemctl is-active zabbix-server nginx mariadb php7.4-fpm
        expected: active four times
        verified: 2026-10-12
      - id: MON-02
        proves: The disk was enlarged (Grafana does not fit on the 2 GB image)
        from: SRV-MON-01 console (5034)
        command: df -h /
        expected: size 7.8G
        verified: 2026-10-12
      - id: MON-03
        proves: Zabbix and Grafana answer locally
        from: SRV-MON-01 console (5034)
        command: |-
          curl -s -m 5 -o /dev/null -w '%{http_code}\n' http://127.0.0.1/
          curl -s -m 5 -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/login
        expected: "200, 200"
        verified: 2026-10-12
      - id: MON-04
        proves: Every panel of the NOC dashboard shows live data (or says "hors profil" for a stopped host)
        from: Windows host, folder 03_Network; lab proxy started
        command: python automation/check_dashboard.py
        expected: '"same panels as noc.json", then "0 empty"'
        verified: 2026-11-10
      - id: MON-05
        proves: A power cut turns the Énergie row of the NOC dashboard red, and the reset turns it back
        from: Windows host (evidence report/evidence/demo_s4_power_dashboard.txt)
        command: python automation/power_test.py   (watch Grafana http://10.60.0.11:3000/ through the proxy)
        expected: Chemin A DOWN, Chemin B > 50 %, GTB CRITICAL in red within 30 s; all green after api/reset
        verified: 2026-11-10

  - id: WEB
    title: Web interfaces from the physical PC
    needs: "ADMIN-WS, FW-A, FW-B and the target of each test"
    tests:
      - id: WEB-01
        proves: The proxy into the administration zone is up
        from: Windows host, folder 03_Network
        command: python automation/lab_proxy.py start
        expected: '"LISTEN ... 192.168.75.128:1080" and "SOCKS5 on 192.168.75.128:1080 -> network namespace of ADMIN-WS"'
        verified: 2026-10-12
      - id: WEB-02
        proves: Each interface answers from the PC
        from: Windows host
        command: |-
          curl --socks5 192.168.75.128:1080 -sk -o NUL -w "%{http_code}" URL
          URL = https://10.90.0.1/  http://10.60.0.11/  http://10.60.0.11:3000/login
                http://10.70.0.12:8080/  http://10.70.0.11:8080/  https://10.50.0.11/health
        expected: "200 for each of the six"
        verified: 2026-10-12
      - id: WEB-03
        proves: Zabbix accepts the administrator and its server process is running
        from: host browser through the proxy (python automation/lab_proxy.py open)
        command: open http://10.60.0.11 and log in as Admin
        expected: 'dashboard "DC Casablanca NOC", no banner "Zabbix server is not running"'
        verified: 2026-10-12
      - id: WEB-04
        proves: Grafana accepts the administrator
        from: Windows host
        command: curl --socks5 192.168.75.128:1080 -s -u admin:PASSWORD http://10.60.0.11:3000/api/org
        expected: '"name":"Main Org."'
        verified: 2026-10-12
      - id: WEB-05
        proves: The CCTV simulator is not reachable from the administration zone (policy)
        from: Windows host
        command: curl --socks5 192.168.75.128:1080 -s -m 8 -o NUL -w "%{http_code}" http://10.80.0.11:8080/
        expected: "000 (no answer): port 8080 is opened to VLAN 70 only"
        verified: 2026-10-12

  - id: NAS
    title: Backup NAS (SRV-BCK-01, TrueNAS SCALE)
    needs: "profile nas (python automation/lab_up.py --profile nas) + SRV-MON-01 and SRV-INF-01; lab proxy started"
    tests:
      - id: NAS-01
        proves: The NAS configuration matches the inventory (pool, snapshots, pull tasks, services, UI)
        from: Windows host, folder 03_Network
        command: python automation/truenas_setup.py apply
        expected: '"0 change(s)", then pool tank ONLINE MIRROR(2 disks), 2 snapshot tasks, 3 rsync PULL tasks, only ssh and snmp running'
        verified: 2026-11-10
      - id: NAS-02
        proves: The bond fails over without cutting the service (one leaf link lost)
        from: Windows host (GNS3 link suspend LEAF-B1 Gi0/2) + ping from ADMIN-WS
        command: ping -i 0.1 10.40.0.11 while the link SRV-BCK-01 eth0 - LEAF-B1 Gi0/2 is suspended for 20 s
        expected: "0 to 2 pings lost (a switchport shutdown does NOT drop the virtual NIC carrier in GNS3)"
        verified: 2026-11-10
      - id: NAS-03
        proves: Settings and bond tuning survive a reboot
        from: Windows host
        command: python automation/truenas_setup.py status   (after a reboot of the NAS)
        expected: 'same status as before; init script 1 POSTINIT enabled; primary_reselect=failure on bond0'
        verified: 2026-11-10
      - id: NAS-04
        proves: The NAS pulls the backups from the servers
        from: Windows host, folder 03_Network
        command: python automation/truenas_setup.py pull
        expected: 3 lines "SUCCESS" (SRV-MON-01 dumps and /etc, SRV-INF-01 /etc)
        verified: 2026-11-10
      - id: NAS-05
        proves: A server cannot reach the NAS (no way to delete the backups)
        from: SRV-MON-01 console
        command: timeout 5 bash -c '</dev/tcp/10.40.0.11/22' || echo blocked    (also 443, 80, 873)
        expected: blocked for each port (core ACL)
        verified: 2026-11-10
      - id: NAS-06
        proves: The pull account can only read
        from: SRV-INF-01 console (root)
        command: sudo -u nasbackup env SSH_ORIGINAL_COMMAND='rsync --server -logDtpre.iLsfxC . /etc/' sudo -n /usr/bin/rrsync -ro /
        expected: '"sending to read-only server not allowed"'
        verified: 2026-11-10
      - id: NAS-07
        proves: A deleted file comes back from a snapshot, identical
        from: Windows host (scripted test, evidence report/evidence/nas5_restore.txt)
        command: create a file on SRV-INF-01, pull, snapshot, delete, pull, copy back from .zfs/snapshot, sha256sum
        expected: same SHA-256 before and after
        verified: 2026-11-10
      - id: NAS-08
        proves: The network configurations are saved on the NAS
        from: Windows host, folder 03_Network
        command: python automation/backup_configs.py
        expected: 'one file per running Cisco device / firewall, "check on the NAS: OK"'
        verified: 2026-11-10
      - id: NAS-09
        proves: Zabbix raises an alarm when the pool degrades, a pull fails or snapshots stop
        from: Windows host (scripted faults, evidence report/evidence/nas6_triggers.txt)
        command: offline one mirror disk; stop sshd on SRV-INF-01 and run its pull; send an old snapshot age
        expected: 'problems "Pool tank pas ONLINE" (disaster), "Tâche de sauvegarde en échec", "Dernier snapshot plus vieux que 2 h" (high) raised, then resolved'
        verified: 2026-11-10

