! ============================================================================================
! LEAF-A2 - LEAF - iosvl2 - TIA-942 space HDA-A
! Generated by automation/gen_configs.py from inventory/dc_casa.yaml - do not edit by hand
! ============================================================================================
version 15.2
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
!
hostname LEAF-A2
!
clock timezone MAR 1 0
no ip domain-lookup
ip domain-name dc.casa.lab
no ip http server
no ip http secure-server
no ip source-route
no ip bootp server
!
enable secret Esprim-Enable-2026!
username netadmin privilege 15 secret Esprim-DC-2026!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
login block-for 120 attempts 5 within 60
login on-failure log
login on-success log
!
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
lldp run
!
vtp mode transparent
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree loopguard default
errdisable recovery cause bpduguard
errdisable recovery interval 300
!
vlan 10
 name MGMT
!
vlan 20
 name SERVEURS
!
vlan 30
 name STOCKAGE
!
vlan 40
 name BACKUP
!
vlan 60
 name MONITORING
!
vlan 70
 name BMS-DCIM
!
vlan 80
 name SECURITE-CCTV
!
vlan 100
 name SERVICES-INT
!
vlan 999
 name PARKING
!
no ip routing
!
interface Gi0/0
 description HDA-A-LEAF-A2:Gi0/0 -> MDA-CORE-A:Gi1/1 | Uplink CORE-A
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 20,30,40,60,70,80,100
 switchport nonegotiate
 no shutdown
!
interface Gi0/1
 description HDA-A-LEAF-A2:Gi0/1 -> MDA-CORE-B:Gi1/1 | Uplink CORE-B
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 20,30,40,60,70,80,100
 switchport nonegotiate
 no shutdown
!
interface Gi0/2
 description HDA-A-LEAF-A2:Gi0/2 -> EDA-A-SRV-CMP-01:eth1 | Serveur NIC1
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Gi0/3
 description HDA-A-LEAF-A2:Gi0/3 -> EDA-A-SRV-CMP-02:eth1 | Serveur NIC1
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Gi1/0
 description HDA-A-LEAF-A2:Gi1/0 -> EDA-A-SRV-CMP-03:eth1 | Serveur NIC1
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Gi1/1
 description HDA-A-LEAF-A2:Gi1/1 -> EDA-A-SRV-STO-01:eth1 | Serveur NIC1
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Gi1/2
 description HDA-A-LEAF-A2:Gi1/2 -> MDA-SW-MGMT:Ethernet7 | OOB VLAN 10
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 spanning-tree portfast
 no shutdown
!
interface Gi1/3
 description UNUSED | parking (CIS: unused ports disabled)
 switchport mode access
 switchport access vlan 999
 switchport nonegotiate
 shutdown
!
interface Gi2/0
 description UNUSED | parking (CIS: unused ports disabled)
 switchport mode access
 switchport access vlan 999
 switchport nonegotiate
 shutdown
!
interface Gi2/1
 description UNUSED | parking (CIS: unused ports disabled)
 switchport mode access
 switchport access vlan 999
 switchport nonegotiate
 shutdown
!
interface Gi2/2
 description UNUSED | parking (CIS: unused ports disabled)
 switchport mode access
