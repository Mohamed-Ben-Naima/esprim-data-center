!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan10
 description OOB management (VLAN 10 is never trunked)
 ip address 10.10.0.32 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.0.254
!
! ---------------------------------------------------------------- management plane
ip access-list standard ACL-MGMT-ACCESS
 remark SSH / SNMP only from ADMIN (VLAN 90) and MONITORING (VLAN 60)
 permit 10.90.0.0 0.0.0.255
 permit 10.60.0.0 0.0.0.255
 deny   any log
!
ntp server 10.100.0.11 prefer
ntp source Vlan10
!
logging buffered 64000 informational
logging trap informational
logging source-interface Vlan10
logging host 10.60.0.12
!
snmp-server view V3-VIEW iso included
snmp-server group G-MONITORING v3 priv read V3-VIEW access ACL-MGMT-ACCESS
snmp-server user zbxmon G-MONITORING v3 auth sha Zbx-Auth-2026! priv aes 128 Zbx-Priv-2026!
snmp-server location DC-CASA / HDA-A
snmp-server contact noc@dc.casa.lab
snmp-server enable traps snmp linkdown linkup coldstart warmstart
snmp-server host 10.60.0.11 version 3 priv zbxmon
snmp-server trap-source Vlan10
!
banner login ^
*******************************************************************
*  DC-CASA - LEAF-A2                                              *
*  Acces reserve aux administrateurs autorises. Toute connexion     *
*  est journalisee (ISO/IEC 27001 A.8.15). Deconnectez-vous si vous *
*  n'etes pas autorise.                                             *
*******************************************************************
^
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 access-class ACL-MGMT-ACCESS in
 transport input ssh
 exec-timeout 10 0
 logging synchronous
line vty 5 15
 transport input none
!
end
