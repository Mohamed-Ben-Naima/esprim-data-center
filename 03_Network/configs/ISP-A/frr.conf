! ISP-A – AS64500 – FRR – generated from inventory/dc_casa.yaml
frr version 8
frr defaults traditional
hostname ISP-A
log syslog informational
service integrated-vtysh-config
!
interface eth0
 description ER-ISP-A:eth0 -> ER-EDGE-A | eBGP AS65100
 ip address 198.51.100.1/30
!
interface eth1
 description ER-ISP-A:eth1 -> ER-EDGE-B | eBGP AS65100
 ip address 198.51.100.5/30
!
ip prefix-list PL-FROM-DC seq 10 permit 192.0.2.0/24
!
route-map RM-DENY-ALL deny 10
!
router bgp 64500
 bgp router-id 198.51.100.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 198.51.100.2 remote-as 65100
 neighbor 198.51.100.2 description EDGE-A
 neighbor 198.51.100.2 password Bgp-DC-2026
 neighbor 198.51.100.2 timers 3 9
 neighbor 198.51.100.6 remote-as 65100
 neighbor 198.51.100.6 description EDGE-B
 neighbor 198.51.100.6 password Bgp-DC-2026
 neighbor 198.51.100.6 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 198.51.100.2 default-originate
  neighbor 198.51.100.2 prefix-list PL-FROM-DC in
  neighbor 198.51.100.2 route-map RM-DENY-ALL out
  neighbor 198.51.100.2 maximum-prefix 10
  neighbor 198.51.100.6 default-originate
  neighbor 198.51.100.6 prefix-list PL-FROM-DC in
  neighbor 198.51.100.6 route-map RM-DENY-ALL out
  neighbor 198.51.100.6 maximum-prefix 10
 exit-address-family
!
line vty
!
