! ============================================================================================
! CORE-B – CORE – iosvl2 – TIA-942 space MDA
! Generated by automation/gen_configs.py from inventory/dc_casa.yaml – do not edit by hand
! ============================================================================================
version 15.2
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
!
hostname CORE-B
!
clock timezone MAR 1 0
no ip domain-lookup
ip domain-name dc.casa.lab
no ip http server
no ip http secure-server
no ip source-route
no ip bootp server
!
enable secret Esprim-Enable-2026!
username netadmin privilege 15 secret Esprim-DC-2026!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
login block-for 120 attempts 5 within 60
login on-failure log
login on-success log
!
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
lldp run
!
vtp mode transparent
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree loopguard default
errdisable recovery cause bpduguard
errdisable recovery interval 300
spanning-tree vlan 30,70,80 priority 4096
spanning-tree vlan 20,40,60,100,902,998 priority 8192
!
vlan 20
 name SERVEURS
!
vlan 30
 name STOCKAGE
!
vlan 40
 name BACKUP
!
vlan 60
 name MONITORING
!
vlan 70
 name BMS-DCIM
!
vlan 80
 name SECURITE-CCTV
!
vlan 100
 name SERVICES-INT
!
vlan 902
 name TRANSIT-INT
!
vlan 998
 name OSPF-CORE
!
vlan 999
 name PARKING
!
ip routing
!
! ---------------------------------------------------------------- OOB management (VRF, never routed in-band)
vrf definition MGMT
 description Out-of-band management VLAN 10
 address-family ipv4
 exit-address-family
!
interface Gi2/0
