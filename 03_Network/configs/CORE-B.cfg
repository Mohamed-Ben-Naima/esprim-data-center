 no switchport
 vrf forwarding MGMT
 ip address 10.10.0.22 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
!
ip route vrf MGMT 0.0.0.0 0.0.0.0 10.10.0.254 name OOB-GW-FW
!
interface Loopback0
