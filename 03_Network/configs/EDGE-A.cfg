! ============================================================================================
! EDGE-A – EDGE – iosv – TIA-942 space ER
! Generated by automation/gen_configs.py from inventory/dc_casa.yaml – do not edit by hand
! ============================================================================================
version 15.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
!
hostname EDGE-A
!
clock timezone MAR 1 0
no ip domain-lookup
ip domain-name dc.casa.lab
no ip http server
no ip http secure-server
no ip source-route
no ip bootp server
!
enable algorithm-type scrypt secret Esprim-Enable-2026!
username netadmin privilege 15 algorithm-type scrypt secret Esprim-DC-2026!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
login block-for 120 attempts 5 within 60
login on-failure log
login on-success log
!
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
lldp run
!
! ---------------------------------------------------------------- OOB management (VRF, never routed in-band)
vrf definition MGMT
 description Out-of-band management VLAN 10
 address-family ipv4
 exit-address-family
!
interface Gi0/5
 description ER-EDGE-A:Gi0/5 -> MDA-SW-MGMT:Ethernet0 | OOB VLAN 10 (VRF MGMT)
 vrf forwarding MGMT
 ip address 10.10.0.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
!
ip route vrf MGMT 0.0.0.0 0.0.0.0 10.10.0.254 name OOB-GW-FW
!
! ---------------------------------------------------------------- tracking (HSRP follows Internet reachability)
track 10 ip route 0.0.0.0 0.0.0.0 reachability
 delay down 1 up 5
!
interface Loopback0
 description Router-ID / iBGP source
 ip address 10.255.0.1 255.255.255.255
 ip ospf 1 area 0
!
ip access-list extended ACL-WAN-IN
 remark anti-spoofing: private, own public prefix and bogon sources dropped
 deny   ip 10.0.0.0 0.255.255.255 any log
 deny   ip 172.16.0.0 0.15.255.255 any log
 deny   ip 192.168.0.0 0.0.255.255 any log
 deny   ip 127.0.0.0 0.255.255.255 any
 deny   ip 192.0.2.0 0.0.0.255 any log
 permit ip any any
!
interface Gi0/0
 description ER-EDGE-A:Gi0/0 -> ER-ISP-A:eth0 | WAN eBGP ISP-A (primaire)
 ip address 198.51.100.2 255.255.255.252
 ip access-group ACL-WAN-IN in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no cdp enable
 no lldp transmit
 no shutdown
!
interface Gi0/1
 description ER-EDGE-A:Gi0/1 -> ER-ISP-B:eth0 | WAN eBGP ISP-B (secours)
 ip address 203.0.113.6 255.255.255.252
 ip access-group ACL-WAN-IN in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no cdp enable
 no lldp transmit
 no shutdown
!
interface Gi0/2
 description ER-EDGE-A:Gi0/2 -> ER-EDGE-B:Gi0/2 | ISL iBGP/OSPF
 ip address 10.254.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 Ospf-DC-2026
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 no shutdown
!
interface Gi0/3
 description ER-EDGE-A:Gi0/3 -> ER-SW-OUT:Ethernet0 | Transit externe VLAN 901
 ip address 10.254.1.2 255.255.255.240
 no ip redirects
 no ip proxy-arp
 ip ospf 1 area 0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 Ospf-DC-2026
 standby version 2
 standby 1 ip 10.254.1.6
 standby 1 priority 110
 standby 1 preempt delay minimum 30
 standby 1 timers msec 250 msec 750
 standby 1 authentication md5 key-string Hsrp-DC-2026
 standby 1 track 10 decrement 20
 standby 1 name HSRP-TRANSIT-EXT
 no shutdown
!
interface Gi0/4
 description UNUSED | parking (CIS: unused ports disabled)
 shutdown
!
interface Gi0/6
 description UNUSED | parking (CIS: unused ports disabled)
 shutdown
!
interface Gi0/7
 description UNUSED | parking (CIS: unused ports disabled)
 shutdown
!
! ---------------------------------------------------------------- routing
router ospf 1
 router-id 10.255.0.1
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface Gi0/2
 no passive-interface Gi0/3
 log-adjacency-changes detail
!
ip prefix-list PL-ANNOUNCE seq 10 permit 192.0.2.0/24
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
!
route-map RM-ISP-A-IN permit 10
 description accept default only, set provider preference
 match ip address prefix-list PL-DEFAULT
 set local-preference 200
!
route-map RM-ISP-A-OUT permit 10
 description announce only our public prefix
 match ip address prefix-list PL-ANNOUNCE
!
route-map RM-ISP-B-IN permit 10
 description accept default only, set provider preference
 match ip address prefix-list PL-DEFAULT
 set local-preference 100
!
route-map RM-ISP-B-OUT permit 10
 description announce only our public prefix
 match ip address prefix-list PL-ANNOUNCE
 set as-path prepend 65100 65100
!
router bgp 65100
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 198.51.100.1 remote-as 64500
 neighbor 198.51.100.1 description ISP-A (AS64500)
 neighbor 198.51.100.1 password Bgp-DC-2026
 neighbor 198.51.100.1 timers 3 9
 neighbor 203.0.113.5 remote-as 64501
 neighbor 203.0.113.5 description ISP-B (AS64501)
 neighbor 203.0.113.5 password Bgp-DC-2026
 neighbor 203.0.113.5 timers 3 9
 neighbor 10.255.0.2 remote-as 65100
 neighbor 10.255.0.2 description iBGP EDGE-B
 neighbor 10.255.0.2 update-source Loopback0
 neighbor 10.255.0.2 password Bgp-DC-2026
 neighbor 10.255.0.2 timers 3 9
 !
 address-family ipv4
  network 192.0.2.0 mask 255.255.255.0
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.1 route-map RM-ISP-A-IN in
  neighbor 198.51.100.1 route-map RM-ISP-A-OUT out
  neighbor 198.51.100.1 maximum-prefix 100 80
  neighbor 203.0.113.5 activate
  neighbor 203.0.113.5 route-map RM-ISP-B-IN in
  neighbor 203.0.113.5 route-map RM-ISP-B-OUT out
  neighbor 203.0.113.5 maximum-prefix 100 80
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
 exit-address-family
!
ip route 192.0.2.0 255.255.255.0 10.254.1.1 name PUBLIC-PREFIX-TO-FW-CARP
!
! ---------------------------------------------------------------- management plane
ip access-list standard ACL-MGMT-ACCESS
 remark SSH / SNMP only from ADMIN (VLAN 90) and MONITORING (VLAN 60)
 permit 10.90.0.0 0.0.0.255
 permit 10.60.0.0 0.0.0.255
 deny   any log
!
ntp server vrf MGMT 10.100.0.11 prefer
ntp source Gi0/5
!
logging buffered 64000 informational
logging trap informational
logging source-interface Gi0/5 vrf MGMT
logging host 10.60.0.12 vrf MGMT
!
snmp-server view V3-VIEW iso included
snmp-server group G-MONITORING v3 priv read V3-VIEW access ACL-MGMT-ACCESS
snmp-server user zbxmon G-MONITORING v3 auth sha Zbx-Auth-2026! priv aes 128 Zbx-Priv-2026!
snmp-server location DC-CASA / ER
snmp-server contact noc@dc.casa.lab
snmp-server enable traps snmp linkdown linkup coldstart warmstart
snmp-server host 10.60.0.11 vrf MGMT version 3 priv zbxmon
snmp-server trap-source Gi0/5
!
banner login ^
*******************************************************************
*  DC-CASA – EDGE-A                                               *
*  Acces reserve aux administrateurs autorises. Toute connexion     *
*  est journalisee (ISO/IEC 27001 A.8.15). Deconnectez-vous si vous *
*  n'etes pas autorise.                                             *
*******************************************************************
^
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 access-class ACL-MGMT-ACCESS in vrf-also
 transport input ssh
 exec-timeout 10 0
 logging synchronous
line vty 5 15
 transport input none
!
end
