server_tokens off;
server {
    listen 80 default_server;
    server_name www.dc.casa.lab;
    location = /health { return 200 "OK SRV-WEB-01\n"; add_header Content-Type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    http2 on;
    server_name www.dc.casa.lab;
    ssl_certificate     /etc/nginx/tls/site.crt;
    ssl_certificate_key /etc/nginx/tls/site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'" always;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ =404; }
    location = /health { return 200 "OK SRV-WEB-01 (TLS)\n"; add_header Content-Type text/plain; }
}
