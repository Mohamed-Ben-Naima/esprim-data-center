global(workDirectory="/var/lib/rsyslog" maxMessageSize="8k")
module(load="imudp")
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")
# Files readable by the viewer account only (group logread), never writable by it (ISO 27001 A.8.15)
module(load="builtin:omfile" fileOwner="root" fileGroup="logread" fileCreateMode="0640"
       dirOwner="root" dirGroup="logread" dirCreateMode="0750")
# /var/log/remote/<source-ip>_<hostname>.log, plus a combined file for quick searches
template(name="PerHost" type="string" string="/var/log/remote/%fromhost-ip%_%hostname%.log")
template(name="Line" type="string" string="%timegenerated:::date-rfc3339% %fromhost-ip% %hostname% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")
*.* action(type="omfile" dynaFile="PerHost" template="Line")
*.* action(type="omfile" file="/var/log/remote/all.log" template="Line")
