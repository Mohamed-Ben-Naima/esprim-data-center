# Daily rotation of the collected logs; retention (rotate N) set at start from LOG_RETENTION_DAYS (inventory)
/var/log/remote/*.log {
    daily
    rotate 30
    maxage 30
    dateext
    dateformat -%Y%m%d
    compress
    missingok
    notifempty
    create 0640 root logread
    sharedscripts
    postrotate
        pkill -HUP rsyslogd || true
    endscript
}
