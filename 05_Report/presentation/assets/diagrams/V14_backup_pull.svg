ump Zabbix 01:30), /etc</text><line x1="1010" y1="380" x2="620" y2="175" stroke="#3FD0E8" stroke-width="3.5" marker-end="url(#ac)"/><text x="815" y="261.5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#3FD0E8" text-anchor="middle" opacity="1">pull, lecture seule</text><rect x="20" y="340" width="600" height="170" rx="12" fill="#1A232C" fill-opacity="1" stroke="#3A4856" stroke-width="1.5"/><rect x="20" y="340" width="600" height="6" rx="3" fill="#2FB3A3"/><text x="38" y="410.1" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#E8EEF2" text-anchor="start" opacity="1">SRV-INF-01</text><text x="38" y="439.1" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="400" fill="#A9B8C4" text-anchor="start" opacity="1">10.100.0.11</text><text x="38" y="466.1" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#A9B8C4" text-anchor="start" opacity="1">/etc</text><line x1="1010" y1="380" x2="620" y2="425" stroke="#3FD0E8" stroke-width="3.5" marker-end="url(#ac)"/><text x="815" y="386.5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#3FD0E8" text-anchor="middle" opacity="1">pull, lecture seule</text><path d="M320 510 L320 600 L1000 600" fill="none" stroke="#E5675F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/><text x="340" y="585" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#E5675F" text-anchor="start" opacity="1">serveur → NAS : bloqué par l&#x27;ACL du cœur</text><rect x="20" y="660" width="1560" height="80" rx="12" fill="#222D38" fill-opacity="1" stroke="#3A4856" stroke-width="1.5"/><text x="50" y="710" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#E8EEF2" text-anchor="start" opacity="1">Un serveur compromis n&#x27;a aucun identifiant vers les sauvegardes : il ne peut ni les lire, ni les chiffrer, ni les effacer.</text></svg>